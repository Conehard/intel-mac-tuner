name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest # pure logic + type-checked FFI; no macOS needed
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: |
          set +e
          cargo test --workspace --locked 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            msg=$(grep -E "^error|panicked|FAILED|failed|-->|left:|right:" test.log | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Test failure::$msg"
          fi
          exit "$code"
        shell: bash

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy (type-check the macOS FFI)
        run: >
          cargo clippy --workspace --all-targets --locked
          --features smc/check-ffi,tuner/check-ffi,menubar/check-ffi -- -D warnings
